<!DOCTYPE html>
<html>
<head>
    <title>LSTTP - One Coin Toss Explorer</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            text-align:center;
            background:#f8f9fa;
            margin:40px;
        }

        h1{
            color:#c62828;
        }

        .coin{
            font-size:120px;
            margin:20px;
        }

        button{
            padding:12px 25px;
            font-size:18px;
            background:#c62828;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#a61d1d;
        }

        .card{
            background:white;
            padding:20px;
            margin:20px auto;
            max-width:700px;
            border-radius:10px;
            box-shadow:0 2px 8px rgba(0,0,0,0.1);
        }

        .result{
            font-size:32px;
            font-weight:bold;
            color:#1565c0;
        }

        table{
            margin:auto;
            border-collapse:collapse;
        }

        td{
            padding:10px 25px;
            border:1px solid #ddd;
        }
    </style>
</head>

<body>

<h1>LSTTP</h1>
<h2>Learn Stats To The Point</h2>

<div class="card">

<h2>One Coin Toss Explorer</h2>

<div class="coin">🪙</div>

<p>
Experiment: Tossing One Coin
</p>

<p>
Sample Space: {H, T}
</p>

<button onclick="tossCoin()">TOSS COIN</button>

<p class="result" id="result">
Click Toss Coin
</p>

</div>

<div class="card">

<h2>Experimental Results</h2>

<table>
<tr>
<td>Total Tosses</td>
<td id="total">0</td>
</tr>

<tr>
<td>Heads</td>
<td id="heads">0</td>
</tr>

<tr>
<td>Tails</td>
<td id="tails">0</td>
</tr>

<tr>
<td>Experimental P(H)</td>
<td id="ph">0</td>
</tr>

<tr>
<td>Experimental P(T)</td>
<td id="pt">0</td>
</tr>
</table>

</div>

<script>

let heads = 0;
let tails = 0;
let total = 0;

function tossCoin(){

    let outcome;

    if(Math.random() < 0.5){
        outcome = "HEAD";
        heads++;
    }
    else{
        outcome = "TAIL";
        tails++;
    }

    total++;

    document.getElementById("result").innerHTML = outcome;

    document.getElementById("total").innerHTML = total;
    document.getElementById("heads").innerHTML = heads;
    document.getElementById("tails").innerHTML = tails;

    document.getElementById("ph").innerHTML =
        (heads/total).toFixed(3);

    document.getElementById("pt").innerHTML =
        (tails/total).toFixed(3);
}

</script>

</body>
</html>
