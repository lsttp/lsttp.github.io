<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LSTTP - One Coin Toss Explorer</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    margin:20px;
    text-align:center;
}

h1{
    color:#c62828;
    margin-bottom:5px;
}

h2{
    color:#444;
}

.coin{
    font-size:120px;
    margin:15px;
}

button{
    background:#c62828;
    color:white;
    border:none;
    padding:12px 20px;
    margin:5px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#a91f1f;
}

.card-container{
    display:flex;
    justify-content:center;
    gap:15px;
    flex-wrap:wrap;
    margin-top:20px;
}

.card{
    background:white;
    padding:15px;
    border-radius:10px;
    width:180px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.card h3{
    margin:0;
    color:#555;
}

.card p{
    font-size:28px;
    margin:10px 0 0;
    color:#1565c0;
}

.chart-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
    margin-top:30px;
}

.chart-box{
    background:white;
    padding:20px;
    border-radius:10px;
    width:500px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.line-chart{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-top:25px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

</style>

</head>

<body>

<h1>LSTTP</h1>
<h2>Learn Stats To The Point</h2>

<h2>One Coin Toss Explorer</h2>

<div class="coin" id="coin">🪙</div>

<button onclick="tossCoin(1)">Toss 1</button> <button onclick="tossCoin(10)">Toss 10</button> <button onclick="tossCoin(100)">Toss 100</button> <button onclick="resetSimulation()">Reset</button>

<h2 id="latestResult">Ready to Toss</h2>

<div class="card-container">

<div class="card">
<h3>Total Tosses</h3>
<p id="total">0</p>
</div>

<div class="card">
<h3>Heads</h3>
<p id="heads">0</p>
</div>

<div class="card">
<h3>Tails</h3>
<p id="tails">0</p>
</div>

<div class="card">
<h3>P(H)</h3>
<p id="ph">0.000</p>
</div>

<div class="card">
<h3>P(T)</h3>
<p id="pt">0.000</p>
</div>

</div>

<div class="chart-row">

<div class="chart-box">
<h3>Theoretical Probability</h3>
<canvas id="pieChart"></canvas>
</div>

<div class="chart-box">
<h3>Observed Frequency</h3>
<canvas id="barChart"></canvas>
</div>

</div>

<div class="line-chart">
<h3>Law of Large Numbers</h3>
<canvas id="lineChart"></canvas>
</div>

<script>

let heads = 0;
let tails = 0;
let total = 0;

let lineLabels = [];
let lineData = [];

const pieChart = new Chart(
document.getElementById('pieChart'),
{
type:'pie',
data:{
labels:['Head','Tail'],
datasets:[{
data:[50,50]
}]
}
}
);

const barChart = new Chart(
document.getElementById('barChart'),
{
type:'bar',
data:{
labels:['Head','Tail'],
datasets:[{
label:'Frequency',
data:[0,0]
}]
}
}
);

const lineChart = new Chart(
document.getElementById('lineChart'),
{
type:'line',
data:{
labels:[],
datasets:[{
label:'Experimental P(H)',
data:[]
}]
},
options:{
responsive:true
}
}
);

function tossCoin(n){

for(let i=0;i<n;i++){

let result;

if(Math.random()<0.5){
heads++;
result="HEAD";
}
else{
tails++;
result="TAIL";
}

total++;

let pHead = heads/total;

lineLabels.push(total);
lineData.push(pHead);

document.getElementById("latestResult").innerHTML =
"Latest Outcome: " + result;
}

updateDisplay();
}

function updateDisplay(){

let ph = total===0 ? 0 : heads/total;
let pt = total===0 ? 0 : tails/total;

document.getElementById("total").innerHTML = total;
document.getElementById("heads").innerHTML = heads;
document.getElementById("tails").innerHTML = tails;

document.getElementById("ph").innerHTML =
ph.toFixed(3);

document.getElementById("pt").innerHTML =
pt.toFixed(3);

barChart.data.datasets[0].data =
[heads,tails];

barChart.update();

lineChart.data.labels =
lineLabels;

lineChart.data.datasets[0].data =
lineData;

lineChart.update();
}

function resetSimulation(){

heads = 0;
tails = 0;
total = 0;

lineLabels = [];
lineData = [];

document.getElementById("latestResult").innerHTML =
"Ready to Toss";

updateDisplay();
}

</script>

</body>
</html>
